name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weedlab
          POSTGRES_PASSWORD: weedlab
          POSTGRES_DB: weedlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weedlab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,data,serve,api,db]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Migrations (Postgres)
        env:
          WEEDLAB_DATABASE_URL: postgresql+psycopg://weedlab:weedlab@localhost:5432/weedlab
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test
        env:
          WEEDLAB_TEST_DATABASE_URL: postgresql+psycopg://weedlab:weedlab@localhost:5432/weedlab
        run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build