name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: weedlab
          POSTGRES_PASSWORD: weedlab
          POSTGRES_DB: weedlab
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U weedlab"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev,data,serve,api,db]"
      - name: Lint
        run: ruff check .
      - name: Format check
        run: ruff format --check .
      - name: Type check
        run: mypy src
      - name: Migrations (Postgres)
        env:
          WEEDLAB_DATABASE_URL: postgresql+psycopg://weedlab:weedlab@localhost:5432/weedlab
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
      - name: Test
        env:
          WEEDLAB_TEST_DATABASE_URL: postgresql+psycopg://weedlab:weedlab@localhost:5432/weedlab
        run: pytest
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Check generated API types are current
        run: |
          npm run gen-api
          git diff --exit-code -- src/api/schema.d.ts
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the Compose file
        run: docker compose config -q
      - name: Build the API image
        run: docker build -t weedlab-api .
      - name: Build the web image
        run: docker build -t weedlab-web --build-arg VITE_API_URL=http://localhost:8000 frontend
      - name: Smoke test the web image
        run: |
          docker run -d --name web -p 8080:8080 weedlab-web
          for i in $(seq 1 15); do
            curl -fsS http://localhost:8080/ > index.html && break
            sleep 1
          done
          grep -q '<div id="root">' index.html