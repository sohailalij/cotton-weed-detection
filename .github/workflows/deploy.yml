name: deploy

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refuse tags that are not on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $GITHUB_REF_NAME points at a commit that is not on main. Not deploying."
            exit 1
          fi

      - name: Trigger the Render deploy for this exact commit
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "RENDER_DEPLOY_HOOK_URL is not set."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "${HOOK}&ref=${GITHUB_SHA}"
          echo "Deploy requested for $GITHUB_REF_NAME ($GITHUB_SHA)."