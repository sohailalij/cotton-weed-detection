[project]
name = "weedlab"
version = "0.1.0"
description = "Cotton weed detection service"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["ruff==0.17.0", "mypy", "pytest", "pre-commit", "httpx==0.28.1"]
data = ["pillow", "pyyaml"]
notebook = ["pandas", "matplotlib", "ipykernel"]
train = ["ultralytics==8.4.181"]
export = ["onnx==1.23.2", "onnxslim==0.1.98", "onnxruntime==1.31.0"]
serve = ["onnxruntime==1.31.0", "numpy==2.4.6", "pillow==12.3.0"]
api = ["fastapi==0.156.4", "uvicorn==0.54.0", "python-multipart==0.0.32", "pydantic==2.14.1", "starlette==1.9.0"]
db = ["sqlalchemy==2.1.5", "alembic==1.20.0", "psycopg[binary]==3.3.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
module = ["ultralytics", "ultralytics.*", "yaml", "onnx", "onnx.*", "onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true
follow_imports = "skip"