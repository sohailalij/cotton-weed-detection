services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weedlab
      POSTGRES_PASSWORD: weedlab
      POSTGRES_DB: weedlab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weedlab"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      WEEDLAB_MODEL_PATH: /models/yolo11s_v1_960.onnx
      WEEDLAB_DATABASE_URL: postgresql+psycopg://weedlab:weedlab@db:5432/weedlab
      WEEDLAB_CORS_ORIGINS: ${WEEDLAB_CORS_ORIGINS:-http://localhost:5173}
      WEEDLAB_RETENTION_DAYS: ${WEEDLAB_RETENTION_DAYS:-7}
    volumes:
      - ./models:/models:ro
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "5173:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata: