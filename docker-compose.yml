services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: weedlab
      POSTGRES_PASSWORD: weedlab
      POSTGRES_DB: weedlab
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weedlab"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata: